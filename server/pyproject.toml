[project]
name = "hozelock"
version = "0.1.0"
description = "Local replacement for the Hozelock Cloud Controller service"
requires-python = ">=3.14"
dependencies = [
    "astral>=3.2",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
hozelock-server = "hozelock.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hozelock"]
